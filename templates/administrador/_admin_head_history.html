{% load static %}
<style>
    :root{color-scheme:dark;--history-bg:#0b0f19;--history-side:#090d16;--history-card:#101625;--history-inner:#0a0d14;--history-line:#1e293b;--history-muted:#94a3b8;--history-green:#34d399}
    *{box-sizing:border-box}
    body.history-body{margin:0;min-height:100vh;background:radial-gradient(900px 380px at 70% -120px,rgba(16,185,129,.1),transparent 70%),var(--history-bg);background-attachment:fixed;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;font-size:.875rem}
    .history-shell{display:flex;height:100dvh;overflow:hidden}
    .history-overlay{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6)}
    .history-sidebar{position:relative;z-index:40;display:flex;flex:0 0 16rem;flex-direction:column;overflow:hidden;background:var(--history-side);border-right:1px solid var(--history-line);transition:flex-basis .2s ease,width .2s ease,transform .2s ease}
    .history-brand{height:3.5rem;display:flex;align-items:center;gap:.75rem;padding:0 1rem;border-bottom:1px solid var(--history-line);flex-shrink:0}
    .history-brand-icon{width:2.25rem;height:2.25rem;display:grid;place-items:center;flex-shrink:0;border-radius:.55rem;background:rgba(16,185,129,.15);color:var(--history-green)}
    .history-brand-name{min-width:0}
    .history-brand-name strong,.history-brand-name span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-brand-name strong{color:#fff;font-size:.875rem;line-height:1.1}
    .history-brand-name span{margin-top:.2rem;color:var(--history-muted);font-size:.7rem}
    .history-sidebar nav{flex:1;overflow:auto;padding:.75rem}
    .history-sidebar nav a{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border:1px solid transparent;border-radius:.5rem;color:var(--history-muted);font-size:.8rem;text-decoration:none;transition:background .15s,color .15s}
    .history-sidebar nav a:hover{background:rgba(30,41,59,.55);color:#fff}
    .history-sidebar nav a[aria-current=page]{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.1);color:#6ee7b7}
    .history-sidebar nav a i{width:1rem;flex-shrink:0;text-align:center}
    .history-sidebar nav a span{display:inline!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-sidebar-foot{padding:.75rem;border-top:1px solid var(--history-line);flex-shrink:0}
    .history-profile{display:flex;align-items:center;gap:.75rem;padding:.6rem .4rem}
    .history-profile-icon{width:2.25rem;height:2.25rem;display:grid;place-items:center;flex-shrink:0;border:1px solid rgba(16,185,129,.3);border-radius:50%;background:rgba(5,150,105,.25);color:#6ee7b7}
    .history-profile-info{min-width:0}
    .history-profile-info p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-profile-name{color:#fff;font-size:.75rem;font-weight:500}
    .history-profile-role{margin-top:.15rem;color:var(--history-muted);font-size:.7rem}
    .history-logout{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:.5rem;color:var(--history-muted);font-size:.8rem;text-decoration:none}
    .history-logout:hover{background:rgba(239,68,68,.1);color:#fca5a5}
    .history-content{display:flex;flex:1;flex-direction:column;min-width:0}
    .history-header{height:3.5rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:0 1rem;border-bottom:1px solid var(--history-line);background:rgba(11,15,25,.95);backdrop-filter:blur(12px);flex-shrink:0}
    .history-header-left,.history-header-title,.history-header-badge{display:flex;align-items:center}
    .history-header-left{gap:.65rem;min-width:0}
    .history-menu{padding:.5rem;margin-left:-.5rem;border:0;border-radius:.5rem;background:transparent;color:#cbd5e1;cursor:pointer}
    .history-menu:hover{background:rgba(30,41,59,.6);color:#fff}
    .history-header-title{gap:.5rem;overflow:hidden;color:#fff;font-size:.9rem;font-weight:600;white-space:nowrap}
    .history-header-title i{color:var(--history-green)}
    .history-clock{display:none;color:#cbd5e1;background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:999px;padding:.25rem .65rem;font-size:.7rem;white-space:nowrap}
    .history-header-badge{gap:.45rem;padding:.35rem .7rem;border:1px solid rgba(16,185,129,.3);border-radius:999px;background:rgba(16,185,129,.1);color:#6ee7b7;font-size:.7rem;font-weight:500;white-space:nowrap}
    .history-main{flex:1;overflow:auto}
    .history-inner{max-width:80rem;margin:auto;padding:1rem;display:grid;gap:1.5rem}
    .history-heading{display:flex;flex-direction:column;justify-content:space-between;gap:.85rem}
    .history-kicker{color:var(--history-green);font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .history-title{color:#fff;font-size:1.5rem;font-weight:700;line-height:2rem;letter-spacing:-.03em}
    .history-subtitle{margin-top:.35rem;color:var(--history-muted);font-size:.85rem}
    .history-actions{display:flex;flex-wrap:wrap;gap:.5rem}
    .history-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.25rem;padding:.48rem .8rem;border:1px solid #334155;border-radius:.5rem;background:var(--history-inner);color:#e2e8f0;font:inherit;font-size:.75rem;font-weight:500;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
    .history-btn:hover{border-color:#475569;background:#1e293b}
    .history-btn-primary{min-height:2.5rem;padding:.55rem .95rem;border-color:transparent;background:#10b981;color:#04130d;font-weight:600}
    .history-btn-primary:hover{background:var(--history-green)}
    .history-card{min-width:0;padding:1.25rem;border:1px solid var(--history-line);border-radius:.9rem;background:var(--history-card);box-shadow:inset 0 1px rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6)}
    .history-card-heading{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding-bottom:.9rem;border-bottom:1px solid var(--history-line)}
    .history-section-icon{width:2.5rem;height:2.5rem;display:grid;place-items:center;flex-shrink:0;border-radius:.65rem;background:rgba(16,185,129,.15);color:#6ee7b7}
    .history-card-kicker{color:var(--history-muted);font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .history-card-title{margin-top:.1rem;color:#fff;font-size:1rem;font-weight:700}
    .history-card-subtitle{margin-top:.2rem;color:var(--history-muted);font-size:.72rem}
    .history-filters{display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem 1rem}
    .history-field{display:grid;gap:.35rem;min-width:0;color:#cbd5e1;font-size:.75rem;font-weight:600}
    .history-input-wrap{display:flex;align-items:center;gap:.55rem;min-width:0;min-height:2.25rem;padding:0 .7rem;border:1px solid #334155;border-radius:.55rem;background:var(--history-inner);color:var(--history-green)}
    .history-input-wrap:focus-within{border-color:rgba(52,211,153,.75);box-shadow:0 0 0 3px rgba(52,211,153,.1)}
    .history-input-wrap>i{flex:0 0 auto}
    .history-input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f8fafc;color-scheme:dark;font:inherit;font-size:.75rem}
    .history-input::placeholder{color:#64748b}
    .history-input option{background-color:#0f172a;color:#f8fafc}
    .history-date{display:grid;gap:.35rem;min-width:0;color:var(--history-muted);font-size:.75rem;font-weight:600}
    .history-date input{width:100%;min-width:0;min-height:2.65rem;padding:.4rem .55rem;border:1px solid #334155;border-radius:.55rem;background:var(--history-inner);color:#f8fafc;color-scheme:dark;font:inherit;font-size:.75rem}
    .history-filter-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--history-line)}
    .history-filter-options,.history-filter-summary{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem}
    .history-filter-options label{display:flex;align-items:center;gap:.5rem;color:#cbd5e1;font-size:.75rem}
    .history-filter-options input[type=checkbox]{width:1rem;height:1rem;accent-color:#10b981}
    .history-filter-options input:disabled{cursor:not-allowed;opacity:1}
    .history-filter-sort{width:auto;min-height:2.25rem;padding:.4rem .75rem;border:1px solid #334155;border-radius:.5rem;background:var(--history-inner);color:#f8fafc;color-scheme:dark;font:inherit;font-size:.75rem}
    .history-filters .history-filter-sort{width:100%;min-height:2.65rem}
    .history-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .history-filter-summary{gap:.75rem}
    .history-filter-status{margin:0;color:var(--history-muted);font-size:.75rem}
    .history-filter-error{display:flex;align-items:flex-start;gap:.45rem;margin-top:.7rem;color:#fca5a5;font-size:.72rem}
    .history-section-title{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;color:#fff;font-size:1rem;font-weight:700}
    .history-section-title i{color:var(--history-green);font-size:.9rem}
    .history-section-tag{margin-left:.15rem;color:var(--history-muted);font-size:.72rem;font-weight:400}
    .history-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
    .history-kpi{min-width:0;padding:1rem;border:1px solid var(--history-line);border-radius:.8rem;background:var(--history-card);box-shadow:inset 0 1px rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6)}
    .history-kpi-highlight{border-color:rgba(16,185,129,.4);background:linear-gradient(160deg,rgba(16,185,129,.13),var(--history-card) 70%)}
    .history-kpi-warning{border-color:rgba(245,158,11,.4);background:linear-gradient(160deg,rgba(245,158,11,.1),var(--history-card) 70%)}
    .history-kpi-label{display:flex;align-items:center;gap:.625rem;color:var(--history-muted);font-size:.75rem}
    .history-kpi-icon{width:2rem;height:2rem;display:grid;place-items:center;flex-shrink:0;border-radius:.55rem;background:#1e293b;color:var(--history-muted);font-size:.8rem}
    .history-kpi-highlight .history-kpi-icon{background:rgba(16,185,129,.2);color:var(--history-green)}
    .history-kpi-warning .history-kpi-icon{background:rgba(245,158,11,.16);color:#fcd34d}
    .history-kpi-value{margin-top:.75rem;overflow-wrap:anywhere;color:#fff;font-size:1.5rem;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
    .history-kpi-highlight .history-kpi-value{color:#6ee7b7}
    .history-kpi-note{margin-top:.25rem;color:#64748b;font-size:.75rem}
    .history-analysis{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
    .history-chart-scroll{overflow-x:auto;padding-bottom:.35rem}
    .history-chart{display:flex;width:100%;align-items:flex-end;gap:.5rem;min-height:0;padding:0 0 .25rem}
    .history-bar-link{display:flex;width:auto;min-width:3rem;flex:1 0 3rem;flex-direction:column;align-items:center;justify-content:flex-end;gap:.4rem;border-radius:.45rem;color:inherit;text-decoration:none}
    .history-bar-link:hover .history-bar{filter:brightness(1.25)}
    .history-bar-value{color:#94a3b8;font-size:.62rem;font-variant-numeric:tabular-nums}
    .history-bar-track{display:flex;width:100%;height:10rem;align-items:flex-end;justify-content:center}
    .history-bar{width:70%;min-height:3px;border-radius:.35rem .35rem .12rem .12rem;background:rgba(16,185,129,.65);transition:filter .15s}
    .history-bar-zero{background:#334155}
    .history-bar-date{color:#64748b;font-size:.62rem;font-variant-numeric:tabular-nums}
    .history-chart-legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-top:.55rem;color:var(--history-muted);font-size:.67rem}
    .history-chart-legend span{display:inline-flex;align-items:center;gap:.4rem}
    .history-dot{width:.55rem;height:.55rem;border-radius:.15rem;background:rgba(16,185,129,.75)}
    .history-mix-list{display:grid;gap:1.1rem}
    .history-mix-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:#cbd5e1;font-size:.875rem}
    .history-mix-head strong{color:#fff;font-size:.875rem;font-variant-numeric:tabular-nums}
    .history-mix-track{height:.45rem;overflow:hidden;margin-top:.5rem;border-radius:999px;background:#1e293b}
    .history-mix-fill{height:100%;border-radius:inherit;background:#10b981}
    .history-mix-fill-transfer{background:#38bdf8}
    .history-mix-icon-cash{color:#34d399}
    .history-mix-icon-transfer{color:#38bdf8}
    .history-mix-icon-usd{color:#fcd34d}
    .history-mix-note{display:flex;align-items:flex-start;gap:.5rem;margin:1.1rem 0 0;color:var(--history-muted);font-size:.75rem}
    .history-turn-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
    .history-turn-card{display:flex;flex-direction:column;gap:.85rem;min-width:0;padding:1.25rem;border:1px solid var(--history-line);border-radius:.9rem;background:var(--history-card);box-shadow:inset 0 1px rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);scroll-margin:1.5rem}
    .history-turn-card:focus{outline:2px solid var(--history-green);outline-offset:2px}
    .history-turn-heading{display:flex;align-items:center;gap:.7rem;min-width:0;padding-bottom:.8rem;border-bottom:1px solid var(--history-line)}
    .history-turn-heading-copy{min-width:0;flex:1}
    .history-turn-date{color:#fff;font-size:1.125rem;font-weight:700;line-height:1.25}
    .history-status{display:inline-flex;align-items:center;gap:.35rem;flex-shrink:0;padding:.25rem .7rem;border:1px solid rgba(16,185,129,.35);border-radius:999px;background:rgba(16,185,129,.1);color:#6ee7b7;font-size:.72rem;font-weight:600;white-space:nowrap}
    .history-turn-meta{display:flex;flex-wrap:wrap;gap:.45rem}
    .history-meta-pill{display:inline-flex;align-items:center;gap:.45rem;padding:.25rem .7rem;border:1px solid var(--history-line);border-radius:999px;background:var(--history-inner);color:#cbd5e1;font-size:.72rem}
    .history-meta-pill-warning{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08);color:#fde68a}
    .history-meta-pill i{color:var(--history-green);font-size:.7rem}
    .history-participants{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
    .history-participants-label{margin-right:.15rem;color:var(--history-muted);font-size:.75rem}
    .history-chip{max-width:100%;overflow:hidden;padding:.2rem .6rem;border:1px solid #334155;border-radius:.375rem;background:#1e293b;color:#e2e8f0;font-size:.75rem;text-overflow:ellipsis;white-space:nowrap}
    .history-turn-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
    .history-stat{min-width:0;padding:.65rem .75rem;border:1px solid var(--history-line);border-radius:.6rem;background:var(--history-inner)}
    .history-stat-highlight{border-color:rgba(16,185,129,.3);background:linear-gradient(160deg,rgba(16,185,129,.1),var(--history-inner) 75%)}
    .history-stat-label{color:var(--history-muted);font-size:.75rem}
    .history-stat-value{margin-top:.125rem;overflow-wrap:anywhere;color:#fff;font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums}
    .history-stat-highlight .history-stat-value{color:#6ee7b7}
    .history-notes{min-height:6rem;padding-top:.75rem;border-top:1px solid var(--history-line)}
    .history-notes-title{margin:0 0 .4rem;color:#cbd5e1;font-size:.875rem;font-weight:500}
    .history-notes-text{margin:0;overflow-wrap:anywhere;color:var(--history-muted);font-size:.875rem;line-height:1.5;white-space:pre-wrap}
    .history-note-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin-top:.7rem}
    .history-note-fact{min-width:0;padding:.55rem .65rem;border:1px solid var(--history-line);border-radius:.55rem;background:var(--history-inner)}
    .history-note-fact-label{color:var(--history-muted);font-size:.7rem}
    .history-note-fact-value{margin-top:.15rem;overflow-wrap:anywhere;color:#e2e8f0;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
    .history-note-disclaimer{margin-top:.4rem;font-size:.7rem}
    .history-notes-text.is-collapsed{max-height:3em;overflow:hidden}
    .history-note-toggle{margin-top:.2rem;padding:0;border:0;background:transparent;color:var(--history-green);font:inherit;font-size:.75rem;cursor:pointer}
    .history-detail-link{align-self:flex-start;margin-top:auto}
    .history-empty{padding:2.5rem 1rem;border:1px dashed #334155;border-radius:.9rem;background:rgba(16,22,37,.55);text-align:center}
    .history-empty-icon{color:#475569;font-size:1.8rem}
    .history-empty-title{margin-top:.75rem;color:#fff;font-size:.9rem;font-weight:700}
    .history-empty-text{margin-top:.35rem;color:var(--history-muted);font-size:.75rem}
    .history-flash{padding:.75rem 1rem;border:1px solid rgba(16,185,129,.3);border-radius:.65rem;background:rgba(16,185,129,.08);color:#a7f3d0;font-size:.8rem}
    .history-pagination{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;margin-top:.25rem}
    .history-skip-link{position:absolute;left:-9999px;top:1rem;z-index:100;padding:.65rem 1rem;border-radius:.5rem;background:var(--history-green);color:#04130d}
    .history-skip-link:focus{left:1rem}
    .history-body :focus-visible{outline:2px solid var(--history-green);outline-offset:2px}
    @media(min-width:640px){.history-inner{padding:1.5rem}.history-heading{flex-direction:row;align-items:end}.history-clock{display:inline-flex}.history-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.history-turn-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(min-width:1024px){
      .history-sidebar.collapsed{flex-basis:4.5rem;width:4.5rem}
      .history-sidebar.collapsed .history-brand,.history-sidebar.collapsed .history-profile{justify-content:center;padding-left:0;padding-right:0}
      .history-sidebar.collapsed .history-brand-name,.history-sidebar.collapsed .history-profile-info,.history-sidebar.collapsed nav a span,.history-sidebar.collapsed .history-logout span{display:none!important}
      .history-sidebar.collapsed nav a,.history-sidebar.collapsed .history-logout{justify-content:center;padding-left:0;padding-right:0}
      .history-sidebar.collapsed nav a{gap:0}
      .history-inner{padding:2rem}
    }
    @media(min-width:1280px){
      .history-filters{grid-template-columns:minmax(0,4fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,2.5fr) minmax(0,2.5fr)}
      .history-filters>:nth-child(3){grid-column:auto}
      .history-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
      .history-analysis{grid-template-columns:minmax(0,3fr) minmax(17rem,2fr)}
      .history-turn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:1023px){
      .history-sidebar{position:fixed;inset:0 auto 0 0;width:16rem;flex-basis:16rem;transform:translateX(-100%)}
      .history-sidebar.is-open{transform:translateX(0)}
      .history-overlay.is-open{display:block}
    }
    @media(max-width:520px){.history-inner{padding:1rem;gap:1.25rem}.history-header{padding:0 .75rem}.history-header-badge{padding:.35rem .5rem}.history-filter-footer{align-items:flex-start}.history-kpi{padding:.7rem}.history-kpi-value{font-size:1.15rem}.history-turn-card{padding:1rem}}
    @media print{
      .history-sidebar,.history-header,.history-actions,.history-overlay,.history-filter-options,.history-detail-link{display:none!important}
      .history-shell,.history-content,.history-main{display:block;height:auto;overflow:visible}
      body.history-body{background:#fff;color:#000}
      .history-card,.history-kpi,.history-turn-card{break-inside:avoid;border:1px solid #ccc;background:#fff;box-shadow:none}
      .history-title,.history-card-title,.history-section-title,.history-turn-date,.history-stat-value,.history-empty-title{color:#000}
      .history-main{overflow:visible}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
