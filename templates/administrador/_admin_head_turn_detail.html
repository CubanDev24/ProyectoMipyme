{% load static %}
<style>
    /* ── IPV table ───────────────────────────────────────────────────── */
    .ipv-wrapper {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(2,6,23,.55);
    }
    .ipv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .73rem;
      white-space: nowrap;
    }
    /* caption / header block */
    .ipv-caption {
      padding: 1rem 1.25rem .6rem;
      border-bottom: 2px solid rgba(52,211,153,.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
    }
    .ipv-caption-title {
      font-size: .85rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -.01em;
    }
    .ipv-caption-sub {
      font-size: .67rem;
      color: #64748b;
      margin-top: .15rem;
    }
    .ipv-caption-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .ipv-export-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      min-height: 34px;
      padding: .4rem .7rem;
      border: 1px solid rgba(148,163,184,.25);
      border-radius: 9px;
      color: #e2e8f0;
      background: rgba(15,23,42,.65);
      font-size: .68rem;
      font-weight: 700;
      text-decoration: none;
      transition: border-color .15s ease, background .15s ease;
    }
    .ipv-export-link:hover {
      border-color: rgba(52,211,153,.55);
      background: rgba(52,211,153,.1);
    }
    .ipv-export-link:focus-visible {
      outline: 2px solid #6ee7b7;
      outline-offset: 2px;
    }
    .ipv-badge-live {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .65rem;
      font-weight: 700;
      color: #6ee7b7;
      background: rgba(52,211,153,.08);
      border: 1px solid rgba(52,211,153,.22);
      border-radius: 999px;
      padding: .28rem .6rem;
    }
    .ipv-badge-live .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #34d399;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    /* column groups */
    .ipv-table thead tr.ipv-group th {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .5rem .75rem .25rem;
      color: #94a3b8;
      border-bottom: 1px solid rgba(148,163,184,.1);
    }
    .ipv-table thead tr.ipv-group th.g-id      { color: #94a3b8; }
    .ipv-table thead tr.ipv-group th.g-stock   { background: rgba(52,211,153,.05); color: #6ee7b7; border-radius: 6px 6px 0 0; }
    .ipv-table thead tr.ipv-group th.g-ventas  { background: rgba(250,204,21,.05);  color: #fcd34d; border-radius: 6px 6px 0 0; }
    .ipv-table thead tr.ipv-group th.g-fin     { background: rgba(99,102,241,.05);  color: #a5b4fc; border-radius: 6px 6px 0 0; }
    /* col headers */
    .ipv-table thead tr.ipv-cols th {
      padding: .4rem .75rem .55rem;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #64748b;
      background: rgba(15,23,42,.6);
      border-bottom: 2px solid rgba(148,163,184,.14);
    }
    .ipv-table thead tr.ipv-cols th.g-stock  { background: rgba(52,211,153,.04); }
    .ipv-table thead tr.ipv-cols th.g-ventas { background: rgba(250,204,21,.04); }
    .ipv-table thead tr.ipv-cols th.g-fin    { background: rgba(99,102,241,.04); }
    /* rows */
    .ipv-table tbody tr {
      border-bottom: 1px solid rgba(148,163,184,.07);
      transition: background .12s;
    }
    .ipv-table tbody tr:last-child { border-bottom: none; }
    .ipv-table tbody tr:hover { background: rgba(148,163,184,.05); }
    .ipv-table tbody tr.ipv-no-stock { opacity: .72; }
    .ipv-table td {
      padding: .55rem .75rem;
      vertical-align: middle;
      color: #cbd5e1;
    }
    .ipv-table td.col-nombre {
      font-weight: 600;
      color: #f1f5f9;
      min-width: 150px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ipv-table td.col-cat {
      color: #64748b;
      font-size: .68rem;
      min-width: 90px;
    }
    /* stock group */
    .ipv-table td.g-stock { background: rgba(52,211,153,.025); color: #a7f3d0; text-align: right; }
    .ipv-table td.g-stock.zero { color: #475569; }
    /* ventas group */
    .ipv-table td.g-ventas { background: rgba(250,204,21,.025); color: #fef08a; text-align: right; }
    .ipv-table td.g-ventas.zero { color: #475569; }
    .ipv-table td.g-ventas.importe { font-weight: 700; color: #fcd34d; font-size: .78rem; }
    /* fin group */
    .ipv-table td.g-fin { background: rgba(99,102,241,.025); color: #c7d2fe; text-align: right; }
    .ipv-table td.g-fin.merma { color: #f87171; }
    .ipv-table td.g-fin.merma.zero { color: #475569; }
    .ipv-table td.col-na { color: #334155; text-align: right; font-style: italic; font-size: .68rem; }
    /* totals row */
    .ipv-table tfoot tr { border-top: 2px solid rgba(52,211,153,.22); }
    .ipv-table tfoot td {
      padding: .65rem .75rem;
      font-weight: 700;
      font-size: .78rem;
    }
    .ipv-table tfoot td.lbl { color: #94a3b8; }
    .ipv-table tfoot td.g-ventas.importe { color: #fcd34d; font-size: .9rem; }
    /* estado / update bar */
    .ipv-update-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .55rem 1.25rem;
      border-top: 1px solid rgba(148,163,184,.1);
      font-size: .65rem;
      color: #475569;
      gap: .5rem;
      flex-wrap: wrap;
    }
    /* skeleton loading */
    .ipv-skeleton {
      padding: 2rem 1.5rem;
      text-align: center;
      color: #475569;
      font-size: .8rem;
    }
    .ipv-skeleton-bar {
      height: 10px;
      background: rgba(148,163,184,.1);
      border-radius: 4px;
      margin: .5rem 0;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .ipv-error {
      padding: 1.5rem;
      color: #f87171;
      font-size: .8rem;
      text-align: center;
    }
  </style>

      .turn-detail-total{align-items:flex-start;flex-direction:column}
      .turn-detail-total>div:last-child{text-align:left}
      .turn-detail-cash-facts{grid-template-columns:1fr}
      .turn-detail-notes{grid-template-columns:1fr}
      .turn-detail-ipv-heading{align-items:flex-start;flex-direction:column;padding:.9rem}

      .xl-head,.xl-meta{align-items:flex-start;flex-direction:column}
      .xl-status{align-items:flex-start;flex-direction:column;padding:0}

    @media print{

      .xl-t td.d,.xl-t tfoot td.d,.xl-t th.rn,.xl-t td.rn{position:static;background:#fff;color:#000;box-shadow:none}
      .xl-status,.xl-t tr.letters,.xl-t .rn{display:none}

<style>
  .turn-detail-page{display:grid;gap:1.25rem;max-width:90rem;margin:auto;padding:1.25rem;color:#e2e8f0}
  .turn-detail-heading,.turn-detail-card-heading{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .turn-detail-heading h1{margin:.5rem 0 0;color:#fff;font-size:1.65rem;font-weight:700;letter-spacing:-.03em}
  .turn-detail-heading p{margin:.35rem 0 0;color:#94a3b8;font-size:.82rem;font-variant-numeric:tabular-nums}
  .turn-detail-back{display:inline-flex;align-items:center;gap:.45rem;color:#94a3b8;font-size:.75rem;text-decoration:none}
  .turn-detail-back:hover{color:#6ee7b7}
  .turn-detail-status{display:inline-flex;align-items:center;gap:.45rem;border:1px solid;border-radius:999px;padding:.4rem .8rem;font-size:.72rem;font-weight:600;white-space:nowrap}
  .turn-detail-status.status-cerrado{border-color:#10b98155;background:#10b9811a;color:#6ee7b7}
  .turn-detail-status.status-abierto{border-color:#38bdf855;background:#38bdf81a;color:#7dd3fc}
  .turn-detail-alert{display:flex;align-items:center;gap:.75rem;border:1px solid #38bdf855;border-radius:.75rem;background:#38bdf80d;padding:.9rem 1rem;color:#bae6fd;font-size:.8rem}
  .turn-detail-alert p{margin:0}
  .turn-detail-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
  .turn-detail-kpi{min-width:0;border:1px solid #1e293b;border-radius:.8rem;background:#101625;padding:.9rem}
  .turn-detail-kpi.is-highlight{border-color:#10b98166;background:linear-gradient(160deg,#10b98122,#101625 70%)}
  .turn-detail-kpi>div{display:flex;align-items:center;gap:.55rem;color:#94a3b8;font-size:.7rem}
  .turn-detail-kpi-icon{display:grid;width:1.9rem;height:1.9rem;flex:none;place-items:center;border-radius:.5rem;background:#1e293b;color:#94a3b8}
  .turn-detail-kpi.is-highlight .turn-detail-kpi-icon{background:#10b98133;color:#34d399}
  .turn-detail-kpi>strong{display:block;overflow:hidden;margin-top:.7rem;color:#fff;font-size:1.15rem;font-weight:700;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  .turn-detail-kpi.is-highlight>strong{color:#6ee7b7}
  .turn-detail-kpi>small{display:block;margin-top:.2rem;color:#64748b;font-size:.68rem}
  .turn-detail-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:1.25rem}
  .turn-detail-card{min-width:0;border:1px solid #1e293b;border-radius:.85rem;background:#101625;padding:1.15rem;box-shadow:0 1px 0 rgba(255,255,255,.025) inset,0 8px 24px -12px rgba(0,0,0,.55)}
  .turn-detail-card-title{display:flex;align-items:center;gap:.55rem;margin:0 0 1rem;color:#fff;font-size:.95rem;font-weight:700}
  .turn-detail-card-title i{color:#34d399;font-size:.85rem}
  .turn-detail-timeline{position:relative;display:grid;grid-template-columns:1.35rem 1fr;align-items:center;gap:.25rem .75rem}
  .turn-detail-timeline-line{position:absolute;top:.95rem;bottom:.95rem;left:.58rem;width:1px;background:linear-gradient(#10b981,#64748b)}
  .turn-detail-timeline-point{z-index:1;display:grid;width:1.2rem;height:1.2rem;place-items:center;border:3px solid #101625;border-radius:50%;font-size:.42rem}
  .turn-detail-timeline-point.is-open{background:#34d399;color:#064e3b}
  .turn-detail-timeline-point.is-close{background:#94a3b8;color:#0f172a}
  .turn-detail-time{padding:.35rem 0}
  .turn-detail-time span,.turn-detail-time small{display:block;color:#94a3b8;font-size:.7rem}
  .turn-detail-time strong{display:block;margin:.1rem 0;color:#fff;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .turn-detail-open-note{grid-column:2;color:#7dd3fc;font-size:.72rem}
  .turn-detail-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;margin-top:1rem}
  .turn-detail-facts>div,.turn-detail-cash-facts>div{border:1px solid #1e293b;border-radius:.6rem;background:#0a0d14;padding:.7rem}
  .turn-detail-facts span{display:flex;align-items:center;gap:.4rem;color:#94a3b8;font-size:.68rem}
  .turn-detail-facts span i{color:#64748b}
  .turn-detail-facts strong{display:block;margin-top:.35rem;color:#fff;font-size:1.2rem;font-variant-numeric:tabular-nums}
  .turn-detail-staff{margin-top:1rem;border-top:1px solid #1e293b;padding-top:.85rem}
  .turn-detail-staff h3{margin:0 0 .45rem;color:#94a3b8;font-size:.7rem;font-weight:600}
  .turn-detail-staff ul{display:grid;gap:.25rem;margin:0;padding:0;list-style:none}
  .turn-detail-staff li{display:flex;align-items:center;gap:.55rem;min-width:0;padding:.3rem 0;color:#e2e8f0;font-size:.75rem}
  .turn-detail-staff li small{margin-left:auto;color:#64748b;font-size:.65rem}
  .turn-detail-avatar{display:grid;width:1.75rem;height:1.75rem;flex:none;place-items:center;border:1px solid #10b98155;border-radius:50%;background:#10b9811a;color:#6ee7b7;font-size:.65rem;font-weight:700}
  .turn-detail-staff .turn-detail-no-staff{color:#64748b}
